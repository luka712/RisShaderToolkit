name: Publish NuGet Package (from CHANGELOG.md)

permissions:
  contents: write  # for tags + commits (if you ever commit changelog updates)

on:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ────────────────────────────────────────────────
      # Extract version from CHANGELOG.md
      # ────────────────────────────────────────────────
      - name: Extract version from CHANGELOG.md
        id: get_version
        run: |
          # Looks for first occurrence of:
          #   ## [1.2.3]     or   ## 1.2.3
          # Ignores lines that don't match
          VERSION=$(sed -nE 's/^##[[:space:]]+(\[)?([0-9]+(\.[0-9]+)*)(\])?.*/\2/p' CHANGELOG.md | head -1)

          if [[ -z "$VERSION" ]]; then
            echo "Error: Could not find a version in CHANGELOG.md (expected format: ## [X.Y.Z] or ## X.Y.Z)"
            exit 1
          fi

          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Optional: If you still want prerelease suffix logic, add it here
      # For example: VERSION="${{ steps.get_version.outputs.version }}-preview.$(date +%s)"   # or run_number, etc.
      # But if changelog already has the final version → leave as-is

      - name: Build
        run: dotnet build ./RisShaderToolkit/RisShaderToolkit.sln --configuration Release

      - name: Pack with version from changelog
        run: |
          dotnet pack ./RisShaderToolkit/RisShaderToolkit/RisShaderToolkit.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            -p:Version=${{ steps.get_version.outputs.version }}

      - name: Find NuGet packages
        id: find_pkgs
        run: |
          mapfile -t packages < <(find ./nupkg -name '*.nupkg' ! -name '*symbols*.nupkg')
          if [ ${#packages[@]} -eq 0 ]; then
            echo "Error: No .nupkg files found!"
            exit 1
          fi
          {
            echo "packages<<EOF"
            printf '%s\n' "${packages[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to NuGet
        run: |
          for pkg in "${{ steps.find_pkgs.outputs.packages }}"; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create and push git tag
        run: |
          git tag "v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md           # full changelog — or see below for latest section only
          draft: false
          prerelease: true                  # ← change to false for stable releases
          generate_release_notes: false     # we use changelog instead
          files: ${{ steps.find_pkgs.outputs.packages }}

      # Optional: nicer release notes → only latest changelog section
      # - name: Extract latest changelog section for release body
      #   if: always()
      #   run: |
      #     sed -n "/^##[[:space:]]\+${{ steps.get_version.outputs.version }}/,\ /^##/p" CHANGELOG.md | head -n -1 > release-body.md
      #     # Then in action-gh-release: body_path: release-body.md